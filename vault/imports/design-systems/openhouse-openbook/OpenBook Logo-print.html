<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OpenBook — Identity (print)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; }
    * { box-sizing: border-box; }

    @page { size: A4 portrait; margin: 1.2cm; }

    @media print {
      html, body {
        background: #f0eee9 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      /* Avoid splitting our moment boards across pages */
      .print-keep { break-inside: avoid; page-break-inside: avoid; }
      /* Hero lives on its own first page */
      .print-page-break { break-before: page; page-break-before: always; }
      /* Neutralize hover/animation residue */
      * { transition: none !important; animation: none !important; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="logo/r4-mark.jsx"></script>
  <script type="text/babel" src="logo/r4-app.jsx"></script>
  <script type="text/babel">
    // After React has mounted and fonts have settled, add print hints to
    // each moment board so they don't straddle pages, then auto-print.
    (async () => {
      // Wait for fonts
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
      // Wait for React to render the tree
      await new Promise(r => setTimeout(r, 800));
      // Tag each "moment" row for print break-inside
      document.querySelectorAll('[class], div').forEach(() => {});
      // Safer: find the outer boards (elements with the characteristic
      // boxShadow + flex centering) — rather than tag, just add a
      // global rule that prevents break-inside for all children of the
      // main column.
      const style = document.createElement('style');
      style.textContent = `
        @media print {
          #root > div > div > div { break-inside: avoid; page-break-inside: avoid; }
          #root > div > div > div > div:first-child { break-inside: avoid; page-break-inside: avoid; }
        }
      `;
      document.head.appendChild(style);
      await new Promise(r => setTimeout(r, 500));
      window.print();
    })();
  </script>
</body>
</html>
