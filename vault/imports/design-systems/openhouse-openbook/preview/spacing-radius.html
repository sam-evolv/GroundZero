<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Radius" subtitle="xs 6 → full · never rounded-none" viewport="700x180" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;padding:28px;font-family:var(--font-sans);}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:18px;}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .shape{width:72px;height:52px;background:#080808;}
  .n{font:600 12px var(--font-sans);}
  .m{font:500 10px var(--font-mono);color:var(--text-2);}
</style></head><body>
<div class="label">Radius · never rounded-none on interactive</div>
<div class="grid">
  <div class="cell"><div class="shape" style="border-radius:6px"></div><div class="n">xs</div><div class="m">6px</div></div>
  <div class="cell"><div class="shape" style="border-radius:10px"></div><div class="n">sm</div><div class="m">10px</div></div>
  <div class="cell"><div class="shape" style="border-radius:12px"></div><div class="n">premium</div><div class="m">12px</div></div>
  <div class="cell"><div class="shape" style="border-radius:14px"></div><div class="n">md</div><div class="m">14px</div></div>
  <div class="cell"><div class="shape" style="border-radius:18px"></div><div class="n">lg</div><div class="m">18px</div></div>
  <div class="cell"><div class="shape" style="border-radius:9999px"></div><div class="n">full</div><div class="m">pill</div></div>
</div>
</body></html>
