<!doctype html>
<!-- @dsCard group="Components" name="Components · Badges" subtitle="Status pills & labels" viewport="700x160" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;padding:28px;font-family:var(--font-sans);color:#111827;}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:18px;}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .badge{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--font-sans);letter-spacing:.04em;padding:4px 10px;border-radius:9999px;text-transform:uppercase;}
  .dot{width:6px;height:6px;border-radius:50%;}
  .b-gold{background:rgba(212,175,55,.12);color:#8B6428;}
  .b-gold .dot{background:#D4AF37;}
  .b-suc{background:#ecfdf5;color:#065f46;}
  .b-suc .dot{background:#10b981;}
  .b-err{background:#fef2f2;color:#991b1b;}
  .b-err .dot{background:#ef4444;}
  .b-warn{background:#fffbeb;color:#92400e;}
  .b-warn .dot{background:#f59e0b;}
  .b-info{background:#eff6ff;color:#1e40af;}
  .b-info .dot{background:#3b82f6;}
  .b-neut{background:#f3f4f6;color:#374151;}
  .b-neut .dot{background:#6b7280;}
  .b-dark{background:#111827;color:#D4AF37;padding:5px 12px;font-size:10px;border-radius:6px;}
</style></head><body>
<div class="label">Badges & status pills</div>
<div class="row">
  <span class="badge b-gold"><span class="dot"></span>Premium</span>
  <span class="badge b-suc"><span class="dot"></span>Confirmed</span>
  <span class="badge b-err"><span class="dot"></span>Overdue</span>
  <span class="badge b-warn"><span class="dot"></span>Snag open</span>
  <span class="badge b-info"><span class="dot"></span>Draft</span>
  <span class="badge b-neut"><span class="dot"></span>Archived</span>
  <span class="badge b-dark">MCP LIVE</span>
</div>
<div class="row" style="margin-top:14px">
  <span class="badge b-gold">FLASH DEAL</span>
  <span class="badge b-suc">Reserved</span>
  <span class="badge b-neut">Savills agent</span>
  <span class="badge b-dark">VAT INVOICED</span>
</div>
</body></html>
