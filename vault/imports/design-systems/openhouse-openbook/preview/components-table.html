<!doctype html>
<!-- @dsCard group="Components" name="Components · Data table" subtitle="Linear density · mono numerics" viewport="700x200" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;padding:24px;font-family:var(--font-sans);color:#111827;}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{font:600 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:#6b7280;text-align:left;padding:10px 12px;border-bottom:1px solid #e5e7eb;}
  td{padding:12px;border-bottom:1px solid #f3f4f6;color:#111827;}
  tr:last-child td{border-bottom:none;}
  .mono{font-family:var(--font-mono);font-size:13px;color:#111827;font-weight:500;}
  .pill{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--font-sans);padding:3px 9px;border-radius:9999px;}
  .dot{width:6px;height:6px;border-radius:50%;}
  .suc{background:#ecfdf5;color:#065f46;}
  .suc .dot{background:#10b981;}
  .warn{background:#fffbeb;color:#92400e;}
  .warn .dot{background:#f59e0b;}
</style></head><body>
<div class="label">Data table · Linear / Stripe density · mono numerics</div>
<table>
  <thead><tr><th>Unit</th><th>Type</th><th>Reserved by</th><th>Handover</th><th>Status</th></tr></thead>
  <tbody>
    <tr><td class="mono">14A</td><td>3-bed semi</td><td>J. Murphy</td><td class="mono">14 Jun 2026</td><td><span class="pill suc"><span class="dot"></span>Confirmed</span></td></tr>
    <tr><td class="mono">14B</td><td>3-bed semi</td><td>S. O'Brien</td><td class="mono">21 Jun 2026</td><td><span class="pill warn"><span class="dot"></span>Snag open</span></td></tr>
    <tr><td class="mono">15A</td><td>4-bed detached</td><td>Available</td><td class="mono">—</td><td><span class="pill" style="background:#f3f4f6;color:#374151"><span class="dot" style="background:#6b7280"></span>Available</span></td></tr>
  </tbody>
</table>
</body></html>
