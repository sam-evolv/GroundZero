<!doctype html>
<!-- @dsCard group="Colors" name="Color · Brand" subtitle="Gold 500, brand black, gradient, glow" viewport="700x200" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;color:var(--text-1);font-family:var(--font-sans);}
  .card{width:700px;padding:28px;box-sizing:border-box;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .sw{display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .sw .chip{width:88px;height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.06);}
  .sw .name{font:600 12px var(--font-sans);letter-spacing:-0.01em;}
  .sw .hex{font:500 11px var(--font-mono);color:var(--text-2);}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:14px;}
</style></head><body>
<div class="card">
  <div class="label">Brand · Gold 500 is primary</div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#D4AF37"></div><div class="name">Gold 500</div><div class="hex">#D4AF37</div></div>
    <div class="sw"><div class="chip" style="background:#080808"></div><div class="name">Brand black</div><div class="hex">#080808</div></div>
    <div class="sw"><div class="chip" style="background:linear-gradient(135deg,#e8c547 0%,#b88a18 100%)"></div><div class="name">Gold gradient</div><div class="hex">135° light→dark</div></div>
    <div class="sw"><div class="chip" style="background:#fff;box-shadow:0 0 20px rgba(212,175,55,.3),inset 0 0 0 1px #D4AF37"></div><div class="name">Gold glow</div><div class="hex">shadow-gold-glow</div></div>
  </div>
</div>
</body></html>
