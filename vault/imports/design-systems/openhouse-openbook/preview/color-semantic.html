<!doctype html>
<!-- @dsCard group="Colors" name="Color · Semantic" subtitle="Success, error, warning, info" viewport="700x210" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;font-family:var(--font-sans);}
  .card{width:700px;padding:28px;box-sizing:border-box;}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .item{border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;}
  .head{padding:10px 14px;font:600 13px var(--font-sans);color:#fff;display:flex;align-items:center;gap:8px;}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.7);}
  .body{padding:10px 14px;font:500 12px var(--font-mono);color:var(--text-2);background:#fff;}
  .ex{padding:10px 14px;font:400 13px var(--font-sans);}
</style></head><body>
<div class="card">
  <div class="label">Semantic · success, error, warning, info</div>
  <div class="grid">
    <div class="item">
      <div class="head" style="background:#10b981"><div class="dot"></div>Success</div>
      <div class="body">#10b981</div>
      <div class="ex" style="background:#ecfdf5;color:#065f46">Booking confirmed</div>
    </div>
    <div class="item">
      <div class="head" style="background:#ef4444"><div class="dot"></div>Error</div>
      <div class="body">#ef4444</div>
      <div class="ex" style="background:#fef2f2;color:#991b1b">Payment declined</div>
    </div>
    <div class="item">
      <div class="head" style="background:#f59e0b"><div class="dot"></div>Warning</div>
      <div class="body">#f59e0b</div>
      <div class="ex" style="background:#fffbeb;color:#92400e">Snag overdue</div>
    </div>
    <div class="item">
      <div class="head" style="background:#3b82f6"><div class="dot"></div>Info</div>
      <div class="body">#3b82f6</div>
      <div class="ex" style="background:#eff6ff;color:#1e40af">Release note</div>
    </div>
  </div>
</div>
</body></html>
