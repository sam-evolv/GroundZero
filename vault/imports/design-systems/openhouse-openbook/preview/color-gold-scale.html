<!doctype html>
<!-- @dsCard group="Colors" name="Color · Gold scale" subtitle="50 → 950 · 500 is primary" viewport="700x180" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;color:var(--text-1);font-family:var(--font-sans);}
  .card{width:700px;padding:28px;box-sizing:border-box;}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:14px;}
  .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;}
  .cell{height:70px;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font:500 10px var(--font-mono);color:#000;}
  .cell.dark{color:#fff;}
  .cell .n{font:600 11px var(--font-sans);}
</style></head><body>
<div class="card">
  <div class="label">Gold scale · 50 → 950</div>
  <div class="scale">
    <div class="cell" style="background:#FEFCE8"><div class="n">50</div>FEFCE8</div>
    <div class="cell" style="background:#FEF9C3"><div class="n">100</div>FEF9C3</div>
    <div class="cell" style="background:#FEF08A"><div class="n">200</div>FEF08A</div>
    <div class="cell" style="background:#FDE047"><div class="n">300</div>FDE047</div>
    <div class="cell" style="background:#FACC15"><div class="n">400</div>FACC15</div>
    <div class="cell" style="background:#D4AF37;outline:2px solid #000;outline-offset:-2px"><div class="n">500</div>D4AF37</div>
    <div class="cell dark" style="background:#C9A961"><div class="n">600</div>C9A961</div>
    <div class="cell dark" style="background:#B8934C"><div class="n">700</div>B8934C</div>
    <div class="cell dark" style="background:#A67C3A"><div class="n">800</div>A67C3A</div>
    <div class="cell dark" style="background:#8B6428"><div class="n">900</div>8B6428</div>
    <div class="cell dark" style="background:#6B4E1C"><div class="n">950</div>6B4E1C</div>
  </div>
</div>
</body></html>
