<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Shadows" subtitle="8 elevations · never pure black" viewport="700x320" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fafafa;padding:28px;font-family:var(--font-sans);}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:22px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;align-items:end;}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .box{width:110px;height:70px;background:#fff;border-radius:12px;}
  .n{font:600 12px var(--font-sans);}
  .m{font:500 10px var(--font-mono);color:var(--text-2);text-align:center;}
</style></head><body>
<div class="label">Shadow scale · never pure black</div>
<div class="grid">
  <div class="cell"><div class="box" style="box-shadow:0 1px 2px rgba(0,0,0,.06),0 1px 1px rgba(0,0,0,.03)"></div><div class="n">shadow-1</div><div class="m">subtle lift</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 8px 24px rgba(0,0,0,.12)"></div><div class="n">shadow-2</div><div class="m">dropdowns</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 16px 48px rgba(0,0,0,.16)"></div><div class="n">shadow-3</div><div class="m">modals</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 2px 12px rgba(12,12,12,.04)"></div><div class="n">shadow-card</div><div class="m">rest</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 4px 24px rgba(12,12,12,.08)"></div><div class="n">card-hover</div><div class="m">lift on hover</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 4px 20px rgba(212,175,55,.18)"></div><div class="n">premium</div><div class="m">brand moment</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 8px 32px rgba(212,175,55,.28)"></div><div class="n">premium-lg</div><div class="m">hero CTA</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 0 20px rgba(212,175,55,.5)"></div><div class="n">gold-glow</div><div class="m">AI buttons</div></div>
</div>
</body></html>
