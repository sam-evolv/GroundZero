<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · 4-pt scale" subtitle="4 · 8 · 12 · 16 · 24 · 32 · 40 · 48 · 64" viewport="700x180" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;padding:28px;font-family:var(--font-sans);}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:18px;}
  .row{display:flex;align-items:flex-end;gap:18px;padding-bottom:14px;border-bottom:1px dashed #e5e7eb;}
  .sw{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .box{background:linear-gradient(135deg,#FEF9C3,#FACC15);}
  .n{font:600 11px var(--font-sans);}
  .m{font:500 10px var(--font-mono);color:var(--text-2);}
</style></head><body>
<div class="label">Spacing · 4-pt scale · no arbitrary values</div>
<div class="row">
  <div class="sw"><div class="box" style="width:4px;height:48px"></div><div class="n">1</div><div class="m">4</div></div>
  <div class="sw"><div class="box" style="width:8px;height:48px"></div><div class="n">2</div><div class="m">8</div></div>
  <div class="sw"><div class="box" style="width:12px;height:48px"></div><div class="n">3</div><div class="m">12</div></div>
  <div class="sw"><div class="box" style="width:16px;height:48px"></div><div class="n">4</div><div class="m">16</div></div>
  <div class="sw"><div class="box" style="width:24px;height:48px"></div><div class="n">6</div><div class="m">24</div></div>
  <div class="sw"><div class="box" style="width:32px;height:48px"></div><div class="n">8</div><div class="m">32</div></div>
  <div class="sw"><div class="box" style="width:40px;height:48px"></div><div class="n">10</div><div class="m">40</div></div>
  <div class="sw"><div class="box" style="width:48px;height:48px"></div><div class="n">12</div><div class="m">48</div></div>
  <div class="sw"><div class="box" style="width:64px;height:48px"></div><div class="n">16</div><div class="m">64</div></div>
</div>
</body></html>
