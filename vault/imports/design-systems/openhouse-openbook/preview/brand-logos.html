<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Logos" subtitle="OpenHouse AI lockups" viewport="700x200" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;padding:28px;font-family:var(--font-sans);color:#111827;}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:18px;}
  .brand{display:flex;gap:28px;align-items:center;flex-wrap:wrap;}
  .item{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .box{display:flex;align-items:center;justify-content:center;border-radius:12px;padding:14px;}
  .on-white{background:#fff;border:1px solid #e5e7eb;width:170px;height:92px;}
  .on-dark{background:#080808;width:170px;height:92px;}
  .on-gold{background:linear-gradient(135deg,#e8c547,#b88a18);width:92px;height:92px;border-radius:20px;}
  img{max-width:100%;max-height:100%;object-fit:contain;}
  .cap{font:500 11px var(--font-mono);color:var(--text-2);}
</style></head><body>
<div class="label">OpenHouse AI · logo usage</div>
<div class="brand">
  <div class="item"><div class="box on-white"><img src="../assets/openhouse-logo-horizontal.png"></div><div class="cap">horizontal · light</div></div>
  <div class="item"><div class="box on-dark"><img src="../assets/openhouse-mark-gold.png"></div><div class="cap">mark · dark</div></div>
  <div class="item"><div class="box on-dark" style="width:92px;height:92px;border-radius:20px;padding:8px"><img src="../assets/openhouse-app-icon.png"></div><div class="cap">iOS app icon</div></div>
  <div class="item"><div class="box on-white" style="width:120px;height:120px"><img src="../assets/openhouse-logo-stacked.png"></div><div class="cap">stacked</div></div>
</div>
</body></html>
