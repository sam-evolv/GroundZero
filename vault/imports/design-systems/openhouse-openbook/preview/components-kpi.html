<!doctype html>
<!-- @dsCard group="Components" name="Components · KPI cards" subtitle="Dashboard stat rhythm" viewport="700x160" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#f9fafb;padding:28px;font-family:var(--font-sans);color:#111827;}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:18px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .kpi{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;}
  .k{font:500 12px var(--font-sans);color:#6b7280;margin-bottom:6px;}
  .v{font:700 28px/1 var(--font-sans);letter-spacing:-0.02em;color:#111827;}
  .d{font:500 12px var(--font-sans);margin-top:8px;display:inline-flex;align-items:center;gap:4px;}
  .up{color:#10b981;}
  .down{color:#ef4444;}
  .accent{background:#fff;border:1px solid #FEF9C3;box-shadow:0 4px 20px rgba(212,175,55,.08);}
  .accent .v{background:linear-gradient(135deg,#D4AF37,#B8934C);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
</style></head><body>
<div class="label">KPI stat cards · dashboard rhythm</div>
<div class="grid">
  <div class="kpi"><div class="k">Units reserved</div><div class="v">48</div><div class="d up">▲ 12 this week</div></div>
  <div class="kpi accent"><div class="k">MRR</div><div class="v">€24,840</div><div class="d up">▲ 8.3%</div></div>
  <div class="kpi"><div class="k">Open snags</div><div class="v">17</div><div class="d down">▼ 3 vs last week</div></div>
  <div class="kpi"><div class="k">Avg handover</div><div class="v">14d</div><div class="d up">▲ 2d faster</div></div>
</div>
</body></html>
