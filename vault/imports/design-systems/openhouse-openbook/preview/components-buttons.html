<!doctype html>
<!-- @dsCard group="Components" name="Components · Buttons" subtitle="Primary · dark · outline · ghost · disabled" viewport="700x180" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;padding:28px;font-family:var(--font-sans);}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:18px;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:14px;font:600 14px var(--font-sans);border:1px solid transparent;cursor:pointer;transition:all 150ms cubic-bezier(0.16,1,0.3,1);}
  .primary{background:#D4AF37;color:#fff;border-color:rgba(184,147,76,.4);box-shadow:0 1px 2px rgba(0,0,0,.06);}
  .primary:hover{background:#C9A961;box-shadow:0 4px 20px rgba(212,175,55,.18);}
  .dark{background:#111827;color:#fff;border-color:rgba(0,0,0,.2);}
  .dark:hover{background:#1f2937;}
  .outline{background:#fff;color:#374151;border-color:#e5e7eb;}
  .outline:hover{background:#f9fafb;border-color:#d1d5db;}
  .ghost{background:transparent;color:#6b7280;}
  .ghost:hover{background:#f3f4f6;color:#111827;}
  .dis{background:#D4AF37;color:#fff;opacity:.5;cursor:not-allowed;}
  .sm{padding:6px 12px;font-size:12px;border-radius:10px;}
</style></head><body>
<div class="label">Buttons · primary · secondary · outline · ghost · disabled</div>
<div class="row">
  <button class="btn primary">Create booking</button>
  <button class="btn dark">Send invite</button>
  <button class="btn outline">Cancel</button>
  <button class="btn ghost">Skip</button>
  <button class="btn dis">Saving…</button>
</div>
<div class="row" style="margin-top:14px">
  <button class="btn primary sm">Book now</button>
  <button class="btn dark sm">Reserve</button>
  <button class="btn outline sm">Details</button>
</div>
</body></html>
