<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Motion" subtitle="150 / 250 / 300 / 350 · premium ease" viewport="700x260" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;padding:24px;font-family:var(--font-sans);color:#111827;}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:18px;}
  .row{display:flex;gap:14px;align-items:center;}
  .dot{width:6px;height:6px;border-radius:50%;}
  .dur{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .bar{height:8px;border-radius:4px;}
  .name{font:600 11px var(--font-sans);}
  .meta{font:500 10px var(--font-mono);color:var(--text-2);}
</style></head><body>
<div class="label">Motion · durations & easing</div>
<div class="row" style="gap:22px">
  <div class="dur"><div class="bar" style="width:24px;background:#D4AF37"></div><div class="name">fast</div><div class="meta">150ms</div></div>
  <div class="dur"><div class="bar" style="width:40px;background:#D4AF37"></div><div class="name">base</div><div class="meta">250ms</div></div>
  <div class="dur"><div class="bar" style="width:48px;background:#D4AF37"></div><div class="name">premium</div><div class="meta">300ms</div></div>
  <div class="dur"><div class="bar" style="width:56px;background:#D4AF37"></div><div class="name">slow</div><div class="meta">350ms</div></div>
</div>
<div style="margin-top:22px">
  <div style="font:600 13px var(--font-sans);margin-bottom:8px">Easing curve</div>
  <svg width="520" height="90" viewBox="0 0 520 90">
    <rect x="0" y="0" width="520" height="90" fill="#f9fafb" rx="8"/>
    <path d="M 20 75 C 100 75, 120 15, 500 15" stroke="#D4AF37" stroke-width="2.5" fill="none"/>
    <circle cx="20" cy="75" r="4" fill="#080808"/>
    <circle cx="500" cy="15" r="4" fill="#080808"/>
  </svg>
  <div class="meta" style="margin-top:4px">cubic-bezier(0.16, 1, 0.3, 1) · never linear</div>
</div>
</body></html>
