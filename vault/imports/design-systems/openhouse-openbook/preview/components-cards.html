<!doctype html>
<!-- @dsCard group="Components" name="Components · Cards" subtitle="Standard · premium · brand dark · glass" viewport="700x260" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#f9fafb;padding:28px;font-family:var(--font-sans);color:#111827;}

  .c-gold h4{color:#D4AF37;}
  .c-gold p{color:#9ca3af;}

</style></head><body>
<div class="label">Cards · standard · premium · brand dark · glass (consumer only)</div>
<div class="grid">

  <div class="card c-prem"><h4>48 units reserved</h4><p>+12 this week across Riverside Gardens.</p></div>
  <div class="card c-gold"><h4>Premium plan active</h4><p>Renews 31 Dec. Next invoice €480.</p></div>
  <div class="glass-bg"><div class="card c-glass"><h4>StyleWorks</h4><p>Booking in 15 minutes. Confirmed.</p></div></div>
</div>
</body></html>
