<!doctype html>
<!-- @dsCard group="Colors" name="Color · Neutrals (light)" subtitle="OpenHouse portals default" viewport="700x260" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#fff;color:var(--text-1);font-family:var(--font-sans);}
  .card{width:700px;padding:28px;box-sizing:border-box;}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .sw{border:1px solid #e5e7eb;border-radius:10px;overflow:hidden;}
  .chip{height:56px;}
  .meta{padding:8px 10px;}
  .n{font:600 12px var(--font-sans);}
  .h{font:500 11px var(--font-mono);color:var(--text-2);}
</style></head><body>
<div class="card">
  <div class="label">Neutrals · light mode</div>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#ffffff;border-bottom:1px solid #e5e7eb"></div><div class="meta"><div class="n">bg</div><div class="h">#ffffff</div></div></div>
    <div class="sw"><div class="chip" style="background:#f9fafb"></div><div class="meta"><div class="n">surface-1</div><div class="h">#f9fafb</div></div></div>
    <div class="sw"><div class="chip" style="background:#f3f4f6"></div><div class="meta"><div class="n">surface-2</div><div class="h">#f3f4f6</div></div></div>
    <div class="sw"><div class="chip" style="background:#e5e7eb"></div><div class="meta"><div class="n">surface-3</div><div class="h">#e5e7eb</div></div></div>
    <div class="sw"><div class="chip" style="background:#111827"></div><div class="meta"><div class="n">text-1</div><div class="h">#111827</div></div></div>
    <div class="sw"><div class="chip" style="background:#6b7280"></div><div class="meta"><div class="n">text-2</div><div class="h">#6b7280</div></div></div>
    <div class="sw"><div class="chip" style="background:#9ca3af"></div><div class="meta"><div class="n">text-3</div><div class="h">#9ca3af</div></div></div>
    <div class="sw"><div class="chip" style="background:#d1d5db"></div><div class="meta"><div class="n">border-strong</div><div class="h">#d1d5db</div></div></div>
  </div>
</div>
</body></html>
