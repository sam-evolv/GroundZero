<!doctype html>
<!-- @dsCard group="Colors" name="Color · Neutrals (dark)" subtitle="OpenBook dashboard default" viewport="700x260" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
  html,body{margin:0;background:#0b0c0f;color:#eef2f8;font-family:var(--font-sans);}
  .card{width:700px;padding:28px;box-sizing:border-box;}
  .label{font:500 11px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;color:#778199;margin-bottom:14px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .sw{border:1px solid #1e2531;border-radius:10px;overflow:hidden;background:#0f1115;}
  .chip{height:56px;}
  .meta{padding:8px 10px;}
  .n{font:600 12px var(--font-sans);color:#eef2f8;}
  .h{font:500 11px var(--font-mono);color:#9ca8bc;}
</style></head><body>
<div class="card">
  <div class="label">Neutrals · dark mode · OpenBook dashboard default</div>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#0b0c0f;border-bottom:1px solid #1e2531"></div><div class="meta"><div class="n">bg</div><div class="h">#0b0c0f</div></div></div>
    <div class="sw"><div class="chip" style="background:#0f1115"></div><div class="meta"><div class="n">surface-1</div><div class="h">#0f1115</div></div></div>
    <div class="sw"><div class="chip" style="background:#12151b"></div><div class="meta"><div class="n">surface-2</div><div class="h">#12151b</div></div></div>
    <div class="sw"><div class="chip" style="background:#161a22"></div><div class="meta"><div class="n">surface-3</div><div class="h">#161a22</div></div></div>
    <div class="sw"><div class="chip" style="background:#eef2f8"></div><div class="meta"><div class="n">text-1</div><div class="h">#eef2f8</div></div></div>
    <div class="sw"><div class="chip" style="background:#9ca8bc"></div><div class="meta"><div class="n">text-2</div><div class="h">#9ca8bc</div></div></div>
    <div class="sw"><div class="chip" style="background:#778199"></div><div class="meta"><div class="n">text-3</div><div class="h">#778199</div></div></div>
    <div class="sw"><div class="chip" style="background:#374151"></div><div class="meta"><div class="n">border-strong</div><div class="h">#374151</div></div></div>
  </div>
</div>
</body></html>
